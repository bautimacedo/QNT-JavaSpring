# Tests: H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Propiedades requeridas sin default — valores dummy para CI
jwt.secret=test-secret-for-ci-only-must-be-at-least-64-bytes-long-padding-padding-padding
qnt.internal.secret=test-internal-secret
app.aib.api-key=test-aib-key
app.aib.upload-dir=/tmp/aib-test
mqtt.broker-url=tcp://localhost:1883
mqtt.username=test
mqtt.password=test
tempest.token=test-tempest-token
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
