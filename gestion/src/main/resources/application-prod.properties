# Perfil producción

# CORS: en prod solo dominios de producción (sin localhost)
app.cors.allowed-origins=https://qnt.dronefieldoperation.cloud,https://qntdrones.com,https://www.qntdrones.com
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
logging.level.com.gestion.qnt=WARN
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# FlightHub 2 (CAM)
flighthub.base-url=https://es-flight-api-us.djigate.com
flighthub.project-uuid=${FLIGHTHUB_PROJECT_UUID}
flighthub.user-token=${FLIGHTHUB_USER_TOKEN}
flighthub.sn=${FLIGHTHUB_SN}
